services:
  # Backend (API Express + TypeScript) — Web Service con Docker
  - type: web
    name: devtree-backend
    runtime: docker
    dockerfilePath: ./DevTree/Dockerfile
    dockerContext: ./DevTree
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false # se configura manualmente en el dashboard de Render
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://devtree-frontend.onrender.com
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Frontend (React + Vite) — Static Site
  - type: web
    name: devtree-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://devtree-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
